        function normalizeTrackFile(file) {
            return String(file || '')
                .replace(/\\/g, '/')
                .replace(/^\.?\//, '')
                .replace(/^music\//i, '')
                .toLowerCase();
        }

        // Turns the album definitions in remixes.js into playable lists. Album
        // entries can be playlist file names or full track objects; unknown
        // files are skipped with a warning instead of breaking the switcher.
        function buildAlbums(libraryTracks) {
            const master = Array.isArray(libraryTracks) ? libraryTracks : [];
            const byFile = new Map();
            master.forEach(song => {
                if (!song || !song.file) return;
                const key = normalizeTrackFile(song.file);
                if (!byFile.has(key)) byFile.set(key, song);
            });

            const configs = Array.isArray(window.myAlbums) ? window.myAlbums : [];
            const built = [];
            const ids = new Set();

            configs.forEach((config, index) => {
                if (!config || typeof config !== 'object') return;
                const title = String(config.title || '').trim();
                const id = String(config.id || slugify(title) || `album-${index + 1}`).trim();
                if (!id || ids.has(id)) {
                    console.warn('Albums: duplicate or missing id, skipped:', config);
                    return;
                }
                ids.add(id);

                const seen = new Set();
                const tracks = (Array.isArray(config.tracks) ? config.tracks : []).map(entry => {
                    let song = null;
                    if (typeof entry === 'string') {
                        song = byFile.get(normalizeTrackFile(entry)) || null;
                    } else if (entry && typeof entry === 'object' && entry.file) {
                        song = { artist: 'Borderline', ...entry };
                    }
                    if (!song || !song.title) {
                        console.warn(`Album "${title || id}" skips an unknown track:`, entry);
                        return null;
                    }
                    const key = normalizeTrackFile(song.file);
                    if (seen.has(key)) return null;
                    seen.add(key);
                    return song;
                }).filter(Boolean);

                if (!tracks.length) return;
                built.push({
                    id,
                    title: title || id,
                    art: config.art || 'cover1.webp',
                    thumb: config.thumb || config.art || 'cover1.webp',
                    background: config.background || 'bg-wide.webp',
                    backgroundTall: config.backgroundTall || config.background || 'bg-tall.webp',
                    accent: config.accent || '',
                    tracks
                });
            });

            if (!built.length && master.length) {
                built.push({
                    id: 'borderline',
                    title: 'Borderline',
                    art: 'cover1.webp',
                    thumb: 'cover1-thumb.webp',
                    background: 'bg-wide.webp',
                    backgroundTall: 'bg-tall.webp',
                    tracks: master.slice()
                });
            }
            return built;
        }

        function albumById(id) {
            return albums.find(album => album.id === id) || null;

        function backgroundImage(value, fallback) {

            document.body.style.setProperty('--album-bg', backgroundImage(album.background, 'bg-wide.webp'));

        function hexToRgb(value) {
            const match = /^#([0-9a-f]{6})$/i.exec(String(value || '').trim());
            if (!match) return null;
            const number = parseInt(match[1], 16);
            return { r: (number >> 16) & 255, g: (number >> 8) & 255, b: number & 255 };
        }

        // A pale version of the accent for text and active lyrics, where the
        // base colour would be too dark against the glass.
        function tintAccent(rgb, amount) {
            const mix = channel => Math.round(channel + (255 - channel) * amount);
            return `rgb(${mix(rgb.r)}, ${mix(rgb.g)}, ${mix(rgb.b)})`;
        }

        // Optional per-album accent; without one the emerald defaults in the
        // stylesheet stay in place.
        function applyAlbumAccent(album) {
            const rgb = hexToRgb(album && album.accent);
            const style = document.body.style;
            const names = ['--accent', '--accent-light', '--accent-soft', '--accent-border', '--accent-glow', '--accent-bar'];
            const meta = document.querySelector('meta[name="theme-color"]');

            if (!rgb) {
                names.forEach(name => style.removeProperty(name));
                if (meta) meta.setAttribute('content', '#031a13');
                return;
            }

            const hex = '#' + [rgb.r, rgb.g, rgb.b].map(value => value.toString(16).padStart(2, '0')).join('');
            const rgba = alpha => `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
            style.setProperty('--accent', hex);
            style.setProperty('--accent-light', tintAccent(rgb, 0.35));
            style.setProperty('--accent-soft', rgba(0.2));
            style.setProperty('--accent-border', rgba(0.5));
            style.setProperty('--accent-glow', rgba(0.34));
            style.setProperty('--accent-bar', rgba(0.16));
            if (meta) meta.setAttribute('content', hex);
        }

        function updateSearchVisibility() {

            const total = albums.reduce((sum, album) => sum + album.tracks.length, 0);
            searchInput.hidden = total <= 8;

        function renderTabs() {
            listTabs.innerHTML = '';
            albums.forEach(album => {
                const button = document.createElement('button');

                button.dataset.list = album.id;
                button.addEventListener('click', () => setList(album.id));
                listTabs.appendChild(button);
            });
            const show = albums.length > 1;
            listTabs.classList.toggle('hidden', !show);
            listTabs.classList.toggle('flex', show);
            if (albums.length) styleTabs(activeList || albums[0].id);
        }

        function styleTabs(name) {
            listTabs.querySelectorAll('button').forEach(btn => {
                const album = albumById(btn.dataset.list);
                if (!album) return;
                const on = album.id === name;
                const runtime = album.tracks.reduce((sum, song) => sum + (song.duration || 0), 0);
                const runtimeText = runtime ? ' \u00b7 ' + formatRuntime(runtime) : '';
                btn.className = 'album-tab flex items-center gap-3 w-full text-left p-2 rounded-lg border transition' + (on ? ' is-active' : '');
                btn.setAttribute('aria-pressed', String(on));
                btn.setAttribute('aria-label', `${album.title}, ${album.tracks.length} track${album.tracks.length === 1 ? '' : 's'}${runtime ? ', ' + formatRuntime(runtime) : ''}`);
                btn.replaceChildren();

                const thumb = document.createElement('img');
                thumb.className = 'album-thumb';
                thumb.src = album.thumb || album.art || 'cover1.webp';
                thumb.alt = '';
                thumb.addEventListener('error', () => {
                    if (!thumb.src.endsWith('/cover1.webp')) thumb.src = 'cover1.webp';
                });

                const wrap = document.createElement('span');
                wrap.className = 'min-w-0';
                const title = document.createElement('span');
                title.className = 'album-tab-title block text-xs font-bold leading-tight';
                title.textContent = album.title;
                const meta = document.createElement('span');
                meta.className = 'block text-[10px] text-gray-500 mt-0.5';
                meta.textContent = `${album.tracks.length} track${album.tracks.length === 1 ? '' : 's'}${runtimeText}`;
                wrap.append(title, meta);
                btn.append(thumb, wrap);
            });
        }

        function setList(name, options) {
            const opts = options || {};
            const album = albumById(name) || albums[0];
            if (!album) return;

            activeList = album.id;
            activeAlbum = album;
            window.myPlaylist = album.tracks;
            const wasPlaying = !audio.paused && !audio.ended;
            const savedIndex = opts.index != null ? opts.index : (listPositions[activeList] || 0);
            currentSongIndex = Math.min(Math.max(savedIndex, 0), Math.max(album.tracks.length - 1, 0));
            styleTabs(activeList);
            applyAlbumBackground(album);
            applyAlbumAccent(album);
            updateAlbumDownloadButton();
            searchInput.value = '';
            searchQuery = '';
            updateSearchVisibility();
            if (shuffleOn) shuffleOrder = buildShuffleOrder(currentSongIndex, album.tracks.length);
            renderModes();
            if (album.tracks.length) {
                loadSong(currentSongIndex, { startAt: opts.startAt || 0 });
                if (wasPlaying || opts.play) playSong();
            }
        }

        renderTabs();

        window.addEventListener('pagehide', () => savePrefs(true));
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') savePrefs(true);
        });

        window.onload = () => {
            if (!albums.length) {
                setSongLabels("Playlist Not Found", "Check playlist.js and remixes.js");
                return;
            }

            // A shared link wins over the last session; otherwise continue where
            // the listener left off. The album is optional in older links.
            const params = new URLSearchParams(location.search);
            const fromUrl = findTrackBySlug(params.get('track'), params.get('album'));
            const savedAlbum = albumById(savedPrefs.list);
            let startAlbum = fromUrl ? albumById(fromUrl.album) : (savedAlbum || albums[0]);
            if (!startAlbum) startAlbum = albums[0];
            let startIndex = fromUrl ? fromUrl.index : (listPositions[startAlbum.id] || 0);
            let startAt = 0;

            if (!fromUrl && savedPrefs.track) {
                // Tracks can move between albums, so the saved index may point at
                // a different song now. Find the saved title, here or elsewhere.
                const sameAlbum = startAlbum.tracks.findIndex(song => slugify(song.title) === savedPrefs.track);
                if (sameAlbum > -1) {
                    startIndex = sameAlbum;
                    if (savedPrefs.position > 2) startAt = Number(savedPrefs.position) || 0;
                } else {
                    const elsewhere = albums
                        .map(album => ({
                            album,
                            index: album.tracks.findIndex(song => slugify(song.title) === savedPrefs.track)
                        }))
                        .find(entry => entry.index > -1);
                    if (elsewhere) {
                        startAlbum = elsewhere.album;
                        startIndex = elsewhere.index;
                        if (savedPrefs.position > 2) startAt = Number(savedPrefs.position) || 0;
                    }
                }
            }

            setList(startAlbum.id, { index: startIndex, startAt });
            updatePositionState();
        };
    </script>
</body>
